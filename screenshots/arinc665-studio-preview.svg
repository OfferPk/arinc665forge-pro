  <text x="425" y="356" font-family="Courier, monospace" font-size="9" fill="#38bdf8">TARGET HARDWARE (LRUs)  : B787-FMC-L, B787-FMC-R</text>
  <text x="425" y="373" font-family="Courier, monospace" font-size="9" fill="#38bdf8">FILE 1: AIRAC2611.DAT [14.68 MB] CRC-32: 0x5C89F10A</text>
